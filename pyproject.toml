[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manuscript-reviewer"
version = "0.1.0"
description = "A privacy-aware multi-agent system for scholarly manuscript peer review."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "pypdf>=4.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["openai>=1.30", "python-dotenv>=1.0"]
anthropic = ["anthropic>=0.30", "python-dotenv>=1.0"]
all = ["openai>=1.30", "anthropic>=0.30", "python-dotenv>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
manuscript-reviewer = "manuscript_reviewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
